<style>
/* Layout: a sequence diagram. Columns = five entity lifelines, rows = atomic commits (time flows down).
   Geometry rule: every commit row puts its message line, its number badge and its first write card on one
   horizontal axis (y = 26px from the row top), so lines only show in the gaps between cards and never cross text. */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --panel-2: #eaeef3; --zebra: #eceff4; --fg: #17202b; --muted: #5a6575; --line: #d6dce4; --msg: #7b8696;
  --accent: #2a55c8; --accent-soft: #e3eafb;
  --conv: #4f5c6e; --conv-soft: #e5e9ef; --conv-line: #bcc5d1;
  --sub: #a05a00; --sub-soft: #fbeedb; --sub-line: #e2be8a;
  --entry: #0b6f61; --entry-soft: #dcf1ec; --entry-line: #95cfc3;
  --task: #5240bd; --task-soft: #ebe8fb; --task-line: #bdb3ef;
  --doc: #ab2a61; --doc-soft: #fae3ec; --doc-line: #e8abc5;
  --ok: #1d7536; --ok-soft: #dff1e4; --bad: #b0261d; --bad-soft: #fae3e1;
  --font-ui: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --axis: 26px; --card-h: 38px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10141a; --panel: #171d25; --panel-2: #1f2731; --zebra: #141a21; --fg: #e4e9f0; --muted: #99a5b4; --line: #2b3440; --msg: #7d8a9b;
  --accent: #8ba7ff; --accent-soft: #1d2947;
  --conv: #a9b3c0; --conv-soft: #232b36; --conv-line: #3d4756;
  --sub: #f0b35c; --sub-soft: #36290f; --sub-line: #6b4f22;
  --entry: #4cc4ae; --entry-soft: #112f29; --entry-line: #22594f;
  --task: #ab9dff; --task-soft: #251f43; --task-line: #463d7c;
  --doc: #f27caa; --doc-soft: #391a28; --doc-line: #6c2e4a;
  --ok: #72d28f; --ok-soft: #14301f; --bad: #ff8c82; --bad-soft: #391917; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10141a; --panel: #171d25; --panel-2: #1f2731; --zebra: #141a21; --fg: #e4e9f0; --muted: #99a5b4; --line: #2b3440; --msg: #7d8a9b;
  --accent: #8ba7ff; --accent-soft: #1d2947;
  --conv: #a9b3c0; --conv-soft: #232b36; --conv-line: #3d4756;
  --sub: #f0b35c; --sub-soft: #36290f; --sub-line: #6b4f22;
  --entry: #4cc4ae; --entry-soft: #112f29; --entry-line: #22594f;
  --task: #ab9dff; --task-soft: #251f43; --task-line: #463d7c;
  --doc: #f27caa; --doc-soft: #391a28; --doc-line: #6c2e4a;
  --ok: #72d28f; --ok-soft: #14301f; --bad: #ff8c82; --bad-soft: #391917; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
.app { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 56px; }
.top { display: grid; gap: 14px; margin-bottom: 16px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.25; margin: 0; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 72ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: var(--panel); gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.howto { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); }
.howto span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 22px; height: 12px; border-radius: 4px; display: inline-block; border: 1px solid var(--task); }
.sw.new { background: var(--task-soft); } .sw.upd { background: var(--panel); } .sw.ret { border-style: dashed; border-color: var(--msg); background: transparent; }

.intro { margin: 0 0 14px; color: var(--fg); max-width: 90ch; }
.quiz { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; margin-bottom: 16px; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 12.5px; }
.qprompt { margin: 0; font-size: 16px; font-weight: 500; max-width: 80ch; }
.opts { display: grid; gap: 6px; max-width: 80ch; }
.opt { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; padding: 6px 10px; cursor: pointer; }
.opt input { margin-top: 5px; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.err { color: var(--bad); font-size: 13px; margin: 0; }
.fb { border-radius: 10px; padding: 9px 12px; max-width: 80ch; font-size: 13.5px; border: 1px solid; }
.fb.ok { background: var(--ok-soft); border-color: var(--ok); } .fb.no { background: var(--bad-soft); border-color: var(--bad); }
.fb b { font-weight: 500; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.hint { color: var(--muted); font-size: 13px; }

.wrap { position: relative; }
@media (max-width: 899px) { .wrap { overflow-x: auto; } }
.seq { display: grid; grid-template-columns: 210px repeat(5, minmax(132px, 1fr)); min-width: 880px; }

.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding: 8px 10px 10px; text-align: center;
  background-image: linear-gradient(var(--lc), var(--lc)); background-repeat: no-repeat; background-size: 2px 10px; background-position: center bottom; }
.head .box { display: block; border-radius: 10px; padding: 5px 6px; background: var(--hs); color: var(--hc); }
.head b { display: block; font-weight: 500; font-size: 14px; }
.head small { display: block; font-family: var(--font-mono); font-size: 11px; opacity: 1; color: var(--hc); }
.head i { display: block; font-style: normal; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.head.corner { background-image: none; text-align: left; font-size: 12px; color: var(--muted); display: flex; align-items: flex-end; padding-bottom: 12px; }
.c0 { --lc: var(--conv-line); --hc: var(--conv); --hs: var(--conv-soft); }
.c1 { --lc: var(--sub-line); --hc: var(--sub); --hs: var(--sub-soft); }
.c2 { --lc: var(--entry-line); --hc: var(--entry); --hs: var(--entry-soft); }
.c3 { --lc: var(--task-line); --hc: var(--task); --hs: var(--task-soft); }
.c4 { --lc: var(--doc-line); --hc: var(--doc); --hs: var(--doc-soft); }

.lab, .cell { position: relative; min-width: 0; }
.z { background-color: var(--zebra); }
.lab { padding: 14px 24px 12px 8px; display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 8px; align-content: start; }
.lab::after { content: ""; position: absolute; right: 0; width: 16px; top: var(--axis); border-top: 1.5px solid var(--msg); }
.num { width: 24px; height: 24px; border-radius: 7px; border: 0; background: var(--fg); color: var(--bg); font: 500 12px/24px var(--font-mono); padding: 0; cursor: pointer; text-align: center; font-variant-numeric: tabular-nums; }
.lab.on .num { background: var(--accent); }
.who { font-size: 12.5px; line-height: 1.45; padding-top: 2px; overflow-wrap: anywhere; }
.nt { grid-column: 2; font-size: 12px; line-height: 1.5; color: var(--muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.cell { padding: 7px 12px 10px; display: flex; flex-direction: column; gap: 6px;
  background-image: linear-gradient(var(--lc), var(--lc)); background-repeat: no-repeat; background-size: 2px 100%; background-position: center top; }
.cell.mf::after { content: ""; position: absolute; left: 0; right: 0; top: var(--axis); border-top: 1.5px solid var(--msg); z-index: 1; }
.cell.me::after { content: ""; position: absolute; left: 0; width: 7px; top: var(--axis); border-top: 1.5px solid var(--msg); z-index: 1; }
.cell.hit::before { content: ""; position: absolute; left: 5px; top: calc(var(--axis) - 4.25px); border-left: 7px solid var(--msg); border-top: 5px solid transparent; border-bottom: 5px solid transparent; z-index: 3; }
.chip { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; height: var(--card-h); padding: 0 9px; border-radius: 8px; border: 1px solid var(--hc); background: var(--panel); text-align: left; width: 100%; cursor: pointer; min-width: 0; }
.chip.new { background: var(--hs); }
.chip.ret { border-style: dashed; border-color: var(--msg); background: var(--panel); }
.chip b { font: 500 12px/1.3 var(--font-mono); color: var(--hc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.ret b { color: var(--muted); }
.chip span { font-size: 11.5px; line-height: 1.35; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.on { box-shadow: 0 0 0 2px var(--fg); }
.chip.ans { box-shadow: 0 0 0 2.5px var(--ok); }
.chip:hover { border-width: 1.5px; }

.det { grid-column: 1 / -1; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin: 4px 0 12px; padding: 14px 16px; display: grid; gap: 10px; position: relative; z-index: 4; }
.det .dh { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.det .dh b { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.det .dh span { color: var(--muted); font-size: 12.5px; }
.det .note { margin: 0; max-width: 95ch; }
.det .atoms { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
.atom { border: 1px solid var(--hc); background: var(--panel); color: var(--fg); border-radius: 7px; padding: 1px 8px; cursor: pointer; font-size: 12px; }
.atom.new { background: var(--hs); } .atom.ret { border-style: dashed; border-color: var(--msg); color: var(--muted); }
.atom.on { box-shadow: 0 0 0 2px var(--fg); }
.det .what { font-weight: 500; }
.det .tip { color: var(--muted); font-size: 12.5px; margin: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.cols .lb { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
pre { margin: 0; font-family: var(--font-mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.foot { padding: 10px 12px; text-align: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); line-height: 1.5; }
.foot b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
.foot.corner { text-align: left; padding-left: 8px; }
[hidden] { display: none !important; }
.source { margin: 6px 0 0; color: var(--muted); font-size: 12px; max-width: 88ch; }
.wrap { container-type: inline-size; }
@media (max-width: 959px) {
  .wrap { overflow-x: auto; }
  .seq { grid-template-columns: 170px repeat(5, minmax(112px, 1fr)); min-width: 740px; }
  .det.inspector { position: sticky; left: 0; width: 100%; width: min(100%, 100cqw); }
}
@media (max-width: 540px) { .app { padding-inline: 8px; } }
.inspector { padding: clamp(10px, 2cqw, 18px); min-width: 0; gap: 14px; border-color: var(--accent); }
.inspector-header, .pane-title, .record-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 14px; flex-wrap: wrap; }
.inspector-header > div:first-child { flex: 1 1 380px; }
.inspector-header h2 { margin: 0 0 3px; font: 600 18px/1.4 var(--font-display); }
.inspector-header h2 span, .pane-title > span, .record-title > span { color: var(--muted); font: 400 12px/1.5 var(--font-ui); }
.inspector-header p { margin: 0; color: var(--muted); max-width: 83ch; }
.observer-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.observer-nav button { font-size: 12px; }
.observer-nav button:disabled { opacity: .46; cursor: default; }
.observe-grid { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); align-items: start; gap: 12px; }
.observe-pane { min-width: 0; display: grid; align-content: start; gap: 9px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.runtime-pane { background: var(--panel-2); }
.storage-pane { background: var(--panel); }
.pane-title h3 { margin: 0; font-size: 15px; font-weight: 700; }
.inspector h4 { margin: 0; font-size: 13px; font-weight: 700; }
.inspector h4 code { font-size: 11.5px; font-weight: 400; color: var(--muted); }
.inspector code { font-family: var(--font-mono); overflow-wrap: anywhere; }
.inspector :is(.muted, .micro, .pane-note, .model-names) { margin: 0; font-size: 12px; }
.inspector :is(.muted, .micro, .pane-note) { color: var(--muted); }
.runtime-grid { display: grid; gap: 6px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.runtime-item { min-width: 0; border: 1px solid var(--line); background: var(--panel); padding: 8px; border-radius: 8px; display: grid; align-content: start; gap: 4px; }
.runtime-item ul { margin: 0; list-style: none; padding: 0; display: grid; gap: 4px; }
.runtime-item li { display: flex; gap: 3px 6px; align-items: baseline; flex-wrap: wrap; font-size: 12px; overflow-wrap: anywhere; }
.model-names code { background: var(--accent-soft); color: var(--accent); padding: 1px 5px; margin-left: 3px; border-radius: 4px; }
.ref-list { display: flex; flex-wrap: wrap; gap: 5px; }
.ref, .cache-key { box-sizing: border-box; max-width: 100%; display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px; font-size: 11.5px; }
.ref { border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 5px; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.ref:hover { border-color: var(--accent); }
.record-view { min-width: 0; display: grid; gap: 7px; }
.record-view:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.record-view .cols { grid-template-columns: repeat(auto-fit, minmax(min(100%, 185px), 1fr)); }
.relations, .document-links { display: grid; gap: 4px; }
.document-links { border-top: 1px solid var(--line); padding-top: 8px; }
@container (max-width: 700px) { .observe-grid { grid-template-columns: 1fr; } }
@container (max-width: 380px) { .runtime-grid { grid-template-columns: 1fr; } }
</style>

<div class="app">
  <header class="top">
    <div>
      <h1>pi-durable 数据结构图解</h1>
      <p class="lede">逐次查看同一批写入，以及调度器、调用实例和文档缓存在提交发布时的状态。</p>
      <p class="source">Python 教学版（基于 pi-durable 1.3.0）实录 · 模拟模型与内存存储。持久化一栏表示实际提交给存储的写入，记录展示省略了部分字段。</p>
    </div>
    <div class="controls">
      <div class="seg" id="scenarios" aria-label="场景"></div>
      <div class="seg" aria-label="模式">
        <button type="button" data-act="mode" data-mode="learn" id="mode-learn">看时序图</button>
        <button type="button" data-act="mode" data-mode="quiz" id="mode-quiz">做练习</button>
      </div>
    </div>
    <div class="howto">
      <span><i class="sw new"></i>新增一条记录</span>
      <span><i class="sw upd"></i>修改（整条替换）</span>
      <span><i class="sw ret"></i>清理任务文档</span>
      <span>箭头尖 = 这次提交写了这一列</span>
      <span>点序号或写入卡片，对照内存与存储</span>
    </div>
  </header>
  <div id="quiz"></div>
  <p class="intro" id="intro"></p>
  <div class="wrap"><div class="seq" id="seq"></div></div>
</div>

  "pi.usage": "每次模型回复、工具调用之后累加。",
  "pi.agent": "会话创建时写入，之后只有 configure() 会改。",
  retire: "任务结束时，框架在同一次提交里清理这个任务作用域下的文档（key t:任务号）。本例里任务没有自己的文档，所以这次清理不删除任何东西。",
};
const DEFAULT_OPEN = { basic: { q: 1, i: 1 }, tools: { q: 5, i: 2 }, inbox: { q: 13, i: 1 }, subagent: { q: 8, i: 0 } };

const S = { sc: 0, mode: "learn", open: null, q: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pj = (o) => esc(JSON.stringify(o, null, 2));
const cur = () => DATA[S.sc];
const curQ = () => cur().quiz[S.q.i];
function nameOf(key) {
  if (!key) return "";
  const i = key.indexOf(":"), t = key.slice(0, i), id = key.slice(i + 1);
  if (t === "doc") { const [k, c] = id.split("@"); return k + "（会话 " + c.slice(2) + "）"; }
  return ({ conversation: "会话", submission: "小票", entry: "条目", task: "任务" })[t] + " #" + id;
}
function buildCommitIndexes(scenario) {
  const commits = [new Map()];
  for (const row of scenario.rows) {
    const state = new Map(commits.at(-1));
    row.x.forEach((item, index) => {
      if (item.key) {
        state.set(item.key, { row: row.q, index, item });
      } else if (item.n === 2 && item.a?.retire) {
        const suffix = `@${item.a.retire}`;
        for (const key of state.keys()) {
          if (key.startsWith("doc:") && key.endsWith(suffix)) state.delete(key);
        }
      }
    });
    commits.push(state);
  }
  return commits;
}

function recordTitle(item) {
  if (!item.key) return item.t;
  if (item.c === 4) return item.key.slice("doc:".length).replace("@", " @ ");
  const type = ["会话", "提交", "条目", "任务"][item.c];
  return `${type} #${item.a.id}`;
}

function recordLinks(item, currentState) {
  if (!item.key) return [];
  const record = item.a;
  const links = new Map();
  const add = (field, type, id) => {
    if (!Number.isInteger(id)) return;
    const key = `${type}:${id}`;
    if (key !== item.key && currentState.has(key) && !links.has(key)) {
      links.set(key, { field, key });
    }
  };

  switch (item.c) {
    case 0:
      add("owner.task_id", "task", record.owner?.task_id);
      add("owner.conversation_id", "conversation", record.owner?.conversation_id);
      break;
    case 1:
      add("entry", "entry", record.entry);
      add("answer", "entry", record.answer);
      break;
    case 2:
      add("by_task_id", "task", record.by_task_id);
      break;
    case 3: {
      const checkpoint = record.state?.checkpoint;
      add("owner", "task", record.owner);
      (record.state?.on ?? []).forEach((id, i) => add(`state.on[${i}]`, "task", id));
      if (record.kind === "pi.generation") {
        add("state.checkpoint.assistant", "entry", checkpoint?.assistant);
        add("state.checkpoint.cutoff", "entry", checkpoint?.cutoff);
        if (checkpoint?.phase === "tools") {
          (checkpoint.tools ?? []).forEach((id, i) => add(`state.checkpoint.tools[${i}]`, "task", id));
        }
      }
      if (record.kind === "pi.tool") add("input.assistant", "entry", record.input?.assistant);
      if (record.kind === "pi.generation" || record.kind === "pi.tool") {
        add("state.outcome.result.entry_id", "entry", record.state?.outcome?.result?.entry_id);
      }
      break;
    }
    case 4: {
      if (item.t === "pi.live") {
        add("run.task_id", "task", record.run?.task_id);
        (record.run?.inputs ?? []).forEach((input, i) => {
          add(`run.inputs[${i}].id`, "submission", input.id);
          add(`run.inputs[${i}].entry`, "entry", input.entry);
        });
        add("generation.task_id", "task", record.generation?.task_id);
        for (const [callId, slot] of Object.entries(record.tools ?? {})) {
          add(`tools[${JSON.stringify(callId)}].task_id`, "task", slot.task_id);
        }
      } else if (item.t === "pi.inbox") {
        (record.items ?? []).forEach((input, i) => add(`items[${i}].id`, "submission", input.id));
      }
      const address = item.key.slice(item.key.lastIndexOf("@") + 1);
      const [scope, id] = address.split(":");
      if (scope === "c") add(`文档地址 ${address}`, "conversation", Number(id));
      if (scope === "t") add(`文档地址 ${address}`, "task", Number(id));
      break;
    }
  }
  add("conversation_id", "conversation", record.conversation_id);
  return [...links.values()];
}

const COMMIT_INDEXES = DATA.map(buildCommitIndexes);

function chipCls(x) { return x.n === 2 ? "ret" : x.n === 1 ? "new" : "upd"; }

function visibleRows() {
  const rows = cur().rows;
  if (S.mode !== "quiz" || !S.q || S.q.finished) return rows;
  const q = curQ();
  return rows.slice(0, S.q.revealed ? q.step + 1 : q.step);
}

function headHTML() {
  return '<div class="head corner">提交（由谁发起）</div>' + COLS.map((c, i) =>
    '<div class="head c' + i + '"><span class="box"><b>' + c.name + "</b><small>" + c.en + "</small></span><i>" + c.like + "</i></div>").join("");
}

function rowHTML(r, idx) {
  const z = idx % 2 ? " z" : "";
  const last = Math.max.apply(null, r.x.map((x) => x.c));
  const openRow = S.open && S.open.q === r.q;
  let h = '<div class="lab' + z + (openRow ? " on" : "") + '"><button type="button" class="num" data-act="row" data-q="' + r.q + '" aria-label="第 ' + r.q + ' 次提交的讲解">' + r.q + "</button>" +
    '<div class="who">' + esc(r.by) + '</div><div class="nt">' + esc(r.note) + "</div></div>";
  for (let c = 0; c < 5; c++) {
    const mine = r.x.map((x, i) => [x, i]).filter(([x]) => x.c === c);
    const m = c < last ? " mf" : c === last ? " me" : "";
    h += '<div class="cell c' + c + z + m + (mine.length ? " hit" : "") + '">' + mine.map(([x, i]) => {
      const on = openRow && (S.open.ref ? S.open.ref === x.key : S.open.i === i);
      const ans = S.mode === "quiz" && S.q && S.q.answered && !S.q.finished && curQ().kind === "pick" && x.key === curQ().answer;
      return '<button type="button" class="chip ' + chipCls(x) + (on ? " on" : "") + (ans ? " ans" : "") + '" data-act="chip" data-q="' + r.q + '" data-i="' + i + '" title="' + esc(x.t + " · " + x.s) + '"><b>' + esc(x.t) + "</b><span>" + esc(x.s) + "</span></button>";
    }).join("") + "</div>";
  }
  if (openRow) h += detailHTML(r);
  return h;
}

const DOC_ROLES = {
  "pi.agent": ["Agent 配置", "会话使用的模型、系统指令和工具配置。生成任务准备请求时会读它。"],
  "pi.live": ["执行进度", "当前 run、正在生成的回复和工具槽位。它是可持久化的文档，也会出现在内存缓存中。"],
  "pi.inbox": ["待处理的输入", "忙碌时排队的 Submission，由调度边界决定何时接入对话。"],
  "pi.usage": ["累计用量", "模型用量和工具调用次数。"],
};

const STATE_LABEL = {
  pending: "待调度", running: "已领走", waiting: "等待依赖", sleeping: "休眠",
  completing: "正在收尾", terminal: "已结束",
};

function refButton(key, label, field = "") {
  return '<button type="button" class="ref" data-act="ref" data-ref="' + esc(key) + '">' +
    (field ? '<code>' + esc(field) + '</code><span aria-hidden="true">→</span>' : "") +
    '<span>' + esc(label) + '</span></button>';
}

function runtimeHTML(r, state) {
  const now = cur().runtime[r.q - 1];
  const prev = cur().runtime[r.q - 2];
  const taskRef = (id) => refButton("task:" + id, "任务 #" + id);
  const liveList = now.live.map((task) =>
    '<li>' + taskRef(task.id) + '<code>' + esc(task.status) + '</code>' +
    '<span>' + esc((STATE_LABEL[task.status] || task.status) + (task.phase ? " · " + task.phase : "")) + '</span></li>'
  ).join("");
  const invocationList = now.invocations.map((inv) => {
    const status = state.get("task:" + inv.task_id)?.item.a.state.status;
    let note = inv.ended || inv.future_done ? "正在清理" : inv.mode === "abort" ? "执行中止处理" : "本次调用仍在内存";
    if (status === "terminal" || status === "waiting") note = "记录已变为 " + status + "，本次调用尚未移出";
    return '<li>' + taskRef(inv.task_id) + '<span>' + esc(note) + '</span></li>';
  }).join("");
  const diff = (before, after, summary) => {
    if (!before) return "";
    if (JSON.stringify(before) === JSON.stringify(after)) return '<p class="micro">与上一提交的采样相同</p>';
    const a = before.map(summary).join("、") || "空", b = after.map(summary).join("、") || "空";
    if (a === b) return "";
    return '<p class="micro">' + esc(a) + ' → ' + esc(b) + '</p>';
  };
  const taskSummary = (task) => "#" + task.id + " " + task.status + (task.phase ? "·" + task.phase : "");
  const invSummary = (inv) => "#" + inv.task_id;
  const cacheSummary = (doc) => doc.kind + "@" + doc.key;
  const cached = now.cache.map((doc) => {
    const key = "doc:" + doc.kind + "@" + doc.key;
    const label = doc.kind + " · " + doc.key;
    return state.has(key) ? refButton(key, label) : '<code class="cache-key">' + esc(label) + '</code>';
  }).join("");
  const models = now.models.map((name) => '<code>' + esc(name) + '</code>').join("");
  const extensions = now.extensions.map((ext) =>
    '<li><code>' + esc(ext.name) + '</code>' + (ext.tools.length ? '<span>' + esc(ext.tools.join("、")) + '</span>' : "") + '</li>'
  ).join("");
  const ownership = now.owners.map(({ conversation_id, task_id }) =>
    '<li>' + refButton("conversation:" + conversation_id, "会话 #" + conversation_id) +
    '<span>归属</span>' + taskRef(task_id) + '</li>'
  ).join("");
  const metadata = now.meta.map(({ id, owner, outcome }) =>
    '<li>' + taskRef(id) + (owner ? '<span>父任务</span>' + taskRef(owner) : '') +
    (outcome ? '<code>' + esc(outcome.status) + '</code>' : '') + '</li>'
  ).join("");
  return '<section class="observe-pane runtime-pane" aria-label="运行时状态">' +
    '<div class="pane-title"><h3>运行时状态</h3><span>内存 · 本次提交发布时</span></div>' +
    '<div class="runtime-grid">' +
    '<section class="runtime-item"><h4>调度器任务索引 <code>_live</code></h4>' +
      (liveList ? '<ul>' + liveList + '</ul>' : '<p class="muted">没有未结束的任务</p>') +
      diff(prev?.live, now.live, taskSummary) + '</section>' +
    '<section class="runtime-item"><h4>调用实例 <code>_invocations</code></h4>' +
      (invocationList ? '<ul>' + invocationList + '</ul>' : '<p class="muted">没有调用实例</p>') +
      diff(prev?.invocations, now.invocations, invSummary) + '</section>' +
    '<section class="runtime-item"><h4>文档缓存 <code>Session._docs</code></h4>' +
      (cached ? '<div class="ref-list">' + cached + '</div>' : '<p class="muted">缓存为空</p>') +
      diff(prev?.cache, now.cache, cacheSummary) + '</section>' +
    '<section class="runtime-item"><h4>已注册的实现 <code>Models / Registry</code></h4>' +
      '<p class="model-names">模型 ' + (models || "无") + '</p>' +
      (extensions ? '<ul>' + extensions + '</ul>' : '<p class="muted">没有用户扩展</p>') + '</section>' +
    (metadata ? '<section class="runtime-item"><h4>任务归属与结局 <code>_meta</code></h4><ul>' + metadata + '</ul></section>' : '') +
    (ownership ? '<section class="runtime-item"><h4>会话归属索引 <code>_conversation_owner</code></h4><ul>' + ownership + '</ul></section>' : "") +
    '</div><p class="pane-note"><code>running</code> 是已保存的任务状态；<code>Invocation</code> 是调度器在内存里建立的调用实例。领走任务的提交先发生，调用实例随后建立。</p></section>';
}

function recordHTML(r, state) {
  const selected = S.open.ref ? state.get(S.open.ref) : null;
  const index = S.open.i;
  const x = selected ? selected.item : r.x[index];
  const atoms = r.x.map((item, j) =>
    '<button type="button" class="atom c' + item.c + " " + chipCls(item) + (!selected && index === j ? " on" : "") +
    '" aria-pressed="' + (!selected && index === j) + '" data-act="write" data-q="' + r.q + '" data-i="' + j + '">' +
    (item.n === 2 ? "" : item.n ? "新增 " : "修改 ") + esc(item.t) + '</button>'
  ).join("");
  const documents = [...state.values()].filter(({ item }) => item.c === 4);
  const docLinks = documents.map(({ item }) => {
    const address = item.key.split("@").at(-1);
    const role = DOC_ROLES[item.t]?.[0];
    return refButton(item.key, item.t + " · " + address + (role ? " · " + role : ""));
  }).join("");
  let record = '<p class="muted">选择一次写入，或查看本步骤仍存在的文档。</p>';
  if (x) {
    const title = x.n === 2 ? x.t : recordTitle(x);
    const tip = x.n === 2 ? TIP.retire : DOC_ROLES[x.t]?.[1] || TIP[x.c];
    const wasWritten = !selected || selected.row === r.q;
    const raw = x.n === 2 ? "" : '<div class="cols">' +
      (wasWritten && x.b && Object.keys(x.b).length ?
        '<div><div class="lb">改之前（变化字段）</div><pre>' + pj(x.b) + '</pre></div>' : "") +
      '<div><div class="lb">' + (wasWritten ? "写入值（节选）" : "此时的存储值（节选）") + '</div><pre>' + pj(x.a) + '</pre></div></div>';
    const links = recordLinks(x, state);
    const related = links.length ? '<div class="relations"><h4>关联字段</h4><div class="ref-list">' +
      links.map(({ field, key }) => refButton(key, recordTitle(state.get(key).item), field)).join("") +
      '</div></div>' : "";
    record = '<div class="record-view" tabindex="-1"><div class="record-title"><h4>' + esc(title) +
      '</h4>' + (!wasWritten ? '<span>最后写于第 ' + selected.row + ' 次提交</span>' : "") + '</div>' +
      (tip ? '<p class="tip">' + esc(tip) + '</p>' : "") + related + raw + '</div>';
  }
  return '<section class="observe-pane storage-pane" aria-label="持久化记录">' +
    '<div class="pane-title"><h3>持久化记录</h3><span>本次提交 · ' + r.x.length + ' 项</span></div>' +
    '<div class="atoms">' + atoms + '</div>' + record +
    (docLinks ? '<div class="document-links"><h4>提交后已有的文档</h4><div class="ref-list">' + docLinks + '</div></div>' : '') +
    '</section>';
}

function detailHTML(r) {
  const state = COMMIT_INDEXES[S.sc][r.q];
  const last = visibleRows().length;
  return '<section class="det inspector" id="commit-inspector" aria-label="第 ' + r.q + ' 次提交详情">' +
    '<div class="inspector-header"><div><h2>第 ' + r.q + ' 次提交 <span>/ ' + last + '</span></h2>' +
    '<p>' + esc(r.note) + '</p></div><div class="observer-nav">' +
    '<button type="button" class="btn" data-act="step" data-dir="-1"' + (r.q === 1 ? " disabled" : "") + '>上一步</button>' +
    '<button type="button" class="btn" data-act="step" data-dir="1"' + (r.q >= last ? " disabled" : "") + '>下一步</button>' +
    '<button type="button" class="btn" data-act="close">收起</button></div></div>' +
    '<div class="observe-grid">' + runtimeHTML(r, state) + recordHTML(r, state) + '</div></section>';
}

function footHTML(rows) {
  const cnt = COLS.map(() => [0, 0]);
  rows.forEach((r) => r.x.forEach((x) => { if (x.n !== 2) cnt[x.c][x.n ? 0 : 1]++; }));
  return '<div class="foot corner">合计（' + rows.length + " 次提交）</div>" + cnt.map(([n, u], i) => '<div class="foot c' + i + '">新增 <b>' + n + "</b> · 修改 <b>" + u + "</b></div>").join("");
}

function quizHTML() {
  const sc = cur(), Q = S.q, total = sc.quiz.length;
  if (Q.finished) {
    return '<div class="quiz"><div class="qhead"><span>' + esc(sc.title) + ' · 练习完成</span></div><p class="qprompt">答对 ' + Q.score + " / " + total + " 题（按第一次作答计）。</p>" +
      '<div class="row"><button type="button" class="btn primary" data-act="restart">再做一遍</button>' +
      (S.sc < DATA.length - 1 ? '<button type="button" class="btn" data-act="nextsc">下一个场景：' + esc(DATA[S.sc + 1].title) + "</button>" : "") +
      '<button type="button" class="btn" data-act="mode" data-mode="learn">回到时序图</button></div></div>';
  }
  const q = curQ();
  let body = "";
  if (q.kind === "choice") {
    const type = q.multi ? "checkbox" : "radio", ans = [].concat(q.answer);
    body += '<div class="opts">' + q.options.map((o, i) => {
      let c = "opt";
      if (Q.answered) { if (ans.includes(i)) c += " right"; else if (Q.chosen.includes(i)) c += " wrong"; }
      const id = "q-" + S.sc + "-" + Q.i + "-" + i;
      return '<label class="' + c + '" for="' + id + '"><input type="' + type + '" name="q" value="' + i + '" id="' + id + '"' + (Q.chosen.includes(i) ? " checked" : "") + (Q.answered ? " disabled" : "") + "><span>" + esc(o) + "</span></label>";
    }).join("") + "</div>";
    if (!Q.answered) body += '<p class="err" id="qerr"' + (Q.err ? "" : " hidden") + '>先选一个答案再提交。</p><div class="row"><button type="button" class="btn primary" data-act="submit">提交答案</button></div>';
  } else if (!Q.answered) {
    body += '<p class="hint">在下面的时序图里点一张卡片作答：点到这条记录的任意一次写入都算。</p><div class="row"><button type="button" class="btn" data-act="giveup">显示答案</button></div>';
  }
  if (Q.answered) {
    let fb = "<b>" + (Q.ok ? "答对了。" : q.kind === "pick" ? (Q.picked ? "不对，你点的是 " + esc(nameOf(Q.picked)) + "。正确答案是 " + esc(nameOf(q.answer)) + "，图上已用绿框标出。" : "正确答案是 " + esc(nameOf(q.answer)) + "，图上已用绿框标出。") : "不对，正确答案已标成绿色。") + "</b> " + esc(q.explain);
    if (Q.revealed) fb += "<br><br><b>第 " + (q.step + 1) + " 次提交实际发生的：</b>" + esc(sc.rows[q.step].note);
    body += '<div class="fb ' + (Q.ok ? "ok" : "no") + '">' + fb + '</div><div class="row">' +
      (q.reveal && !Q.revealed ? '<button type="button" class="btn" data-act="reveal">看看下一次提交写了什么</button>' : "") +
      '<button type="button" class="btn primary" data-act="nextq">' + (Q.i === total - 1 ? "查看成绩" : "下一题") + "</button></div>";
  }
  const shown = Q.revealed ? q.step + 1 : q.step;
  return '<div class="quiz"><div class="qhead"><span>' + esc(sc.title) + " · 练习 " + (Q.i + 1) + " / " + total + "</span><span>时序图显示到第 " + shown + " 次提交</span><span>已答对 " + Q.score + "</span></div>" +
    '<p class="qprompt">' + esc(q.prompt) + "</p>" + body + "</div>";
}

function render() {
  const active = document.activeElement;
  const control = active?.matches("[data-act]") ? { ...active.dataset } : null;
  $("#scenarios").innerHTML = DATA.map((d, i) => '<button type="button" data-act="sc" data-i="' + i + '" aria-pressed="' + (i === S.sc) + '">' + esc(d.title) + "</button>").join("");
  $("#mode-learn").setAttribute("aria-pressed", String(S.mode === "learn"));
  $("#mode-quiz").setAttribute("aria-pressed", String(S.mode === "quiz"));
  $("#quiz").innerHTML = S.mode === "quiz" ? quizHTML() : "";
  $("#intro").textContent = cur().intro;
  const rows = visibleRows();
  $("#seq").innerHTML = headHTML() + rows.map(rowHTML).join("") + footHTML(rows);
  if (active && !active.isConnected && control) {
    const same = [...document.querySelectorAll("[data-act]")].find((el) =>
      !el.disabled && Object.entries(control).every(([key, value]) => el.dataset[key] === value));
    same?.focus({ preventScroll: true });
  }
}

function startQuiz() { S.q = { i: 0, score: 0, finished: false }; loadQ(); }
function loadQ() { Object.assign(S.q, { answered: false, chosen: [], ok: false, revealed: false, picked: null, err: false }); S.open = null; render(); }
function openDefault() { const d = DEFAULT_OPEN[cur().id]; S.open = d ? { q: d.q, i: d.i } : null; }

document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act;
  if (act === "chip" || act === "write") {
    const q = +a.dataset.q, i = +a.dataset.i, x = cur().rows[q - 1].x[i];
    if (S.mode === "quiz" && S.q && !S.q.finished && !S.q.answered && curQ().kind === "pick" && x.key) {
      S.q.answered = true; S.q.picked = x.key; S.q.ok = x.key === curQ().answer; if (S.q.ok) S.q.score++;
      S.open = { q, i }; render(); return;
    }
    S.open = { q, i };
    render();
  } else if (act === "row") {
    S.open = { q: +a.dataset.q, i: -1 };
    render();
  } else if (act === "step") {
    const q = S.open.q + Number(a.dataset.dir);
    if (q < 1 || q > visibleRows().length) return;
    S.open = { q, i: 0 };
    render();
    $("#commit-inspector")?.scrollIntoView({ block: "nearest", inline: "nearest" });
    if (document.activeElement === document.body) {
      $('#commit-inspector [data-act="step"]:not(:disabled)')?.focus({ preventScroll: true });
    }
  } else if (act === "ref") {
    const state = COMMIT_INDEXES[S.sc][S.open.q];
    if (!state.has(a.dataset.ref)) return;
    S.open = { q: S.open.q, i: -1, ref: a.dataset.ref };
    render();
    $("#commit-inspector .record-view")?.focus({ preventScroll: true });
  }
  else if (act === "close") {
    const q = S.open.q;
    S.open = null;
    render();
    $('.num[data-q="' + q + '"]')?.focus({ preventScroll: true });
  }
  else if (act === "sc") { S.sc = +a.dataset.i; if (S.mode === "quiz") startQuiz(); else { openDefault(); render(); } }
  else if (act === "mode") { S.mode = a.dataset.mode; if (S.mode === "quiz") startQuiz(); else { openDefault(); render(); } }
  else if (act === "submit") {
    const chosen = Array.from(document.querySelectorAll('input[name="q"]:checked')).map((x) => +x.value);
    if (!chosen.length) { S.q.err = true; const el = $("#qerr"); if (el) el.hidden = false; return; }
    const want = [].concat(curQ().answer).slice().sort().join(",");
    Object.assign(S.q, { chosen, answered: true, err: false, ok: chosen.slice().sort().join(",") === want });
    if (S.q.ok) S.q.score++;
    render();
  }
  else if (act === "giveup") { Object.assign(S.q, { answered: true, ok: false, picked: null }); render(); }
  else if (act === "reveal") { S.q.revealed = true; S.open = { q: curQ().step + 1, i: -1 }; render(); }
  else if (act === "nextq") { if (S.q.i >= cur().quiz.length - 1) { S.q.finished = true; render(); } else { S.q.i++; loadQ(); } }
  else if (act === "restart") startQuiz();
  else if (act === "nextsc") { S.sc = Math.min(DATA.length - 1, S.sc + 1); startQuiz(); }
});
document.addEventListener("change", (e) => {
  if (e.target.name !== "q" || !S.q) return;
  S.q.chosen = Array.from(document.querySelectorAll('input[name="q"]:checked')).map((input) => Number(input.value));
  S.q.err = false;
  const message = $("#qerr");
  if (message) message.hidden = true;
});

openDefault();
render();
</script>
